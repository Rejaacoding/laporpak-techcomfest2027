<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaporPAK! — Server API Lokal</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fffbf5;
        color: #1c1917;
      }
      main {
        max-width: 520px;
        background: #ffffff;
        border: 1px solid #e7dfd3;
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 8px 0;
        line-height: 1.5;
        color: #57534e;
      }
      code {
        background: #fef3e2;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Backend LaporPAK! aktif di port 5050</h1>
      <p>
        Mode pengembangan frontend berjalan terpisah lewat Vite. Jalankan
        <code>npm --prefix frontend run dev</code> lalu buka
        <a href="http://localhost:5173">http://localhost:5173</a>.
      </p>
      <p>
        Untuk menjalankan frontend produksi dari port ini, jalankan
        <code>npm run build</code> lebih dulu.
      </p>
    </main>
  </body>
</html>
